name: Release to NPM

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A PAT can be supplied to let CI run on release-please PRs.
          # Falls back to the workflow token for normal release creation.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Checkout release commit
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install pnpm
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node 22.14+ and npm CLI 11.5.1+.
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Check workspace versions
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: pnpm test:versions

      - name: Run tests
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: pnpm test

      - name: Typecheck tests
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: pnpm test:typecheck

      - name: Typecheck spatial package
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: pnpm --filter @visorium/spatial test:typecheck

      - name: Lint
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: pnpm lint

      - name: Build core and spatial packages
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: pnpm build:all

      - name: Validate core package
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: pnpm run lint:package

      - name: Validate spatial package
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: pnpm --filter @visorium/spatial lint:package

      # Publish spatial first so the core version never points at a missing
      # matching spatial version.
      - name: Publish spatial to npm
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        working-directory: packages/spatial
        # Trusted publishing authenticates with OIDC and generates provenance
        # automatically. NPM_TOKEN is intentionally not used here.
        run: npm publish --access public

      - name: Publish core to npm
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        # Trusted publishing authenticates with OIDC and generates provenance
        # automatically. NPM_TOKEN is intentionally not used here.
        run: npm publish --access public
